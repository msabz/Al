name: DeepMind P30 INT8 Adaptive Timesteps

on:
  push:
    branches:
      - feat/p30-int8-adaptive-timesteps
    paths:
      - scripts/pruned_snn_vs_mlp.py
      - scripts/deepmind_pruned_snn_stress.py
      - scripts/deepmind_rsnn_pruning_sweep.py
      - scripts/deepmind_p30_int8_ablation.py
      - scripts/deepmind_p30_int8_adaptive_timesteps.py
      - .github/workflows/deepmind-p30-int8-adaptive-timesteps.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adaptive-timesteps:
    name: P30 INT8 QAT fixed T25 vs adaptive early exit
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      OMP_NUM_THREADS: 4
      MKL_NUM_THREADS: 4

    steps:
      - name: Checkout exact experiment source
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install CPU scientific stack
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install numpy sympy absl-py six
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Static contract
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/pruned_snn_vs_mlp.py \
            scripts/deepmind_pruned_snn_stress.py \
            scripts/deepmind_rsnn_pruning_sweep.py \
            scripts/deepmind_p30_int8_ablation.py \
            scripts/deepmind_p30_int8_adaptive_timesteps.py
          grep -q 'P30_INT8_QAT_T25' scripts/deepmind_p30_int8_adaptive_timesteps.py
          grep -q 'ADAPTIVE_CONSERVATIVE' scripts/deepmind_p30_int8_adaptive_timesteps.py
          grep -q 'ADAPTIVE_BALANCED' scripts/deepmind_p30_int8_adaptive_timesteps.py
          grep -q 'ADAPTIVE_AGGRESSIVE' scripts/deepmind_p30_int8_adaptive_timesteps.py
          grep -q 'no test-set tuning' scripts/deepmind_p30_int8_adaptive_timesteps.py
          echo 'ADAPTIVE_STATIC_CONTRACT_PASS'

      - name: Preflight exact T25 equivalence and step bounds
        run: |
          set -euo pipefail
          python scripts/deepmind_p30_int8_adaptive_timesteps.py \
            --preflight \
            --output-dir /tmp/unused | tee /tmp/adaptive-preflight.log
          grep -q 'ADAPTIVE_TIMESTEP_PREFLIGHT_PASS' /tmp/adaptive-preflight.log

      - name: Run exact 5-seed DeepMind adaptive timestep ablation
        run: |
          set -euo pipefail
          python scripts/deepmind_p30_int8_adaptive_timesteps.py \
            --train-size 8192 \
            --eval-size 2048 \
            --ill-pool-size 4096 \
            --ill-size 1024 \
            --epochs 300 \
            --batch-size 256 \
            --seeds 11,22,33,44,55 \
            --output-dir deepmind-p30-int8-adaptive-output | tee /tmp/adaptive.log
          grep -q 'project synthetic data=0' /tmp/adaptive.log
          grep -q 'ADAPTIVE_TIMESTEP_EXPERIMENT_COMPLETE' /tmp/adaptive.log

      - name: Print adaptive timestep summary
        if: always()
        run: |
          echo '===== P30 INT8 ADAPTIVE TIMESTEP SUMMARY ====='
          cat deepmind-p30-int8-adaptive-output/SUMMARY.txt 2>/dev/null || true
          echo '===== LAST LOG LINES ====='
          tail -n 220 /tmp/adaptive.log 2>/dev/null || true

      - name: Upload adaptive timestep evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deepmind-p30-int8-adaptive-timestep-evidence
          path: |
            deepmind-p30-int8-adaptive-output/**
            /tmp/adaptive-preflight.log
            /tmp/adaptive.log
          if-no-files-found: warn
          retention-days: 90

name: Validate v6 Manifold Lattice on DeepMind

on:
  push:
    branches:
      - feat/v5-deepmind-colab
    paths:
      - scripts/cpu_v6_manifold_lattice_deepmind.py
      - .github/workflows/validate-v6-manifold-lattice.yml

permissions:
  contents: read

jobs:
  official-deepmind-manifold-lattice:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout exact feature source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install CPU-only scientific stack
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install numpy sympy absl-py six
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Static experiment contract
        run: |
          set -euo pipefail
          python -m py_compile scripts/cpu_v6_manifold_lattice_deepmind.py
          python - <<'PY'
          from pathlib import Path
          s=Path('scripts/cpu_v6_manifold_lattice_deepmind.py').read_text()
          required=(
              'google-deepmind/mathematics_dataset.git',
              'class OrdinaryMLP',
              'class ManifoldLattice3D',
              'SIDE = 3',
              'x^2+y^2+z^2=1',
              'x^2+y^2=1',
              'z=x*y',
              'SEEDS = (11, 22, 33)',
              'STEPS = 5000',
              'V6_MANIFOLD_LATTICE_DEEPMIND_',
          )
          missing=[x for x in required if x not in s]
          if missing:
              raise SystemExit(f'missing manifold experiment markers: {missing}')
          forbidden=('SYNTHETIC_POOL', 'project synthetic', 'cuda')
          found=[x for x in forbidden if x in s.lower()]
          if found:
              raise SystemExit(f'forbidden marker in CPU DeepMind experiment: {found}')
          print('V6_MANIFOLD_STATIC_CONTRACT_PASS')
          PY

      - name: Run parameter-matched DeepMind comparison
        run: |
          set -euo pipefail
          python scripts/cpu_v6_manifold_lattice_deepmind.py | tee /tmp/v6-manifold-lattice.log
          grep -Eq 'V6_MANIFOLD_LATTICE_DEEPMIND_(CLEAR_SIGNAL|NO_CLEAR_SIGNAL)' /tmp/v6-manifold-lattice.log

      - name: Upload CPU evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v6-manifold-lattice-deepmind-cpu-evidence
          path: /tmp/v6-manifold-lattice.log
          if-no-files-found: warn
          retention-days: 30

name: Kaggle Add/Sub Smoke Test

on:
  push:
    branches: ["feat/v5-deepmind-colab"]
    paths:
      - "kaggle/smoke_add_sub.py"
      - ".github/workflows/kaggle-add-sub-smoke.yml"
  workflow_dispatch:

concurrency:
  group: math-ai-kaggle-add-sub-smoke
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Kaggle CLI
        run: python -m pip install --upgrade kaggle

      - name: Authenticate Kaggle
        id: kaggle
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${KAGGLE_API_TOKEN:-}" || { echo "KAGGLE_API_TOKEN missing"; exit 20; }
          python - <<'PY'
          import os
          from kaggle.api.kaggle_api_extended import KaggleApi
          api = KaggleApi()
          api.authenticate()
          owner = (getattr(api, 'config_values', {}) or {}).get('username') or ''
          if not owner:
              raise SystemExit('Could not discover Kaggle username')
          print('KAGGLE_AUTH_OK owner=' + owner)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('owner=' + owner + '\n')
              f.write('kernel_ref=' + owner + '/mathai-add-sub-smoke\n')
          PY

      - name: Prepare tiny T4 kernel
        env:
          OWNER: ${{ steps.kaggle.outputs.owner }}
        run: |
          set -euo pipefail
          rm -rf .kaggle-smoke kaggle-smoke-output verified-smoke
          mkdir -p .kaggle-smoke kaggle-smoke-output verified-smoke
          cp kaggle/smoke_add_sub.py .kaggle-smoke/smoke_add_sub.py
          sed -i "s/__SOURCE_COMMIT__/${GITHUB_SHA}/g" .kaggle-smoke/smoke_add_sub.py
          cat > .kaggle-smoke/kernel-metadata.json <<JSON
          {
            "id": "${OWNER}/mathai-add-sub-smoke",
            "title": "MathAI Add Sub Smoke",
            "code_file": "smoke_add_sub.py",
            "language": "python",
            "kernel_type": "script",
            "is_private": true,
            "enable_gpu": true,
            "enable_internet": false,
            "machine_shape": "NvidiaTeslaT4",
            "dataset_sources": [],
            "competition_sources": [],
            "kernel_sources": [],
            "model_sources": []
          }
          JSON
          cat .kaggle-smoke/kernel-metadata.json

      - name: Launch tiny Kaggle training
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          kaggle kernels push -p .kaggle-smoke --accelerator NvidiaTeslaT4 --timeout 18000 | tee launch.log

      - name: Monitor Kaggle kernel
        id: monitor
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KERNEL_REF: ${{ steps.kaggle.outputs.kernel_ref }}
        run: |
          set -uo pipefail
          outcome="timeout"
          : > status.log
          for i in $(seq 1 180); do
            status="$(kaggle kernels status "${KERNEL_REF}" 2>&1)"
            rc=$?
            stamp="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "[${stamp}] rc=${rc} ${status}" | tee -a status.log
            lower="$(printf '%s' "${status}" | tr '[:upper:]' '[:lower:]')"
            if printf '%s' "${lower}" | grep -Eq 'complete|success'; then
              outcome="complete"
              break
            fi
            if printf '%s' "${lower}" | grep -Eq 'error|failed|cancelled|canceled'; then
              outcome="failed"
              break
            fi
            sleep 20
          done
          echo "outcome=${outcome}" >> "$GITHUB_OUTPUT"
          echo "KAGGLE_FINAL_OUTCOME=${outcome}"
          [ "${outcome}" = "complete" ] || exit 30

      - name: Download only smoke outputs
        if: always()
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KERNEL_REF: ${{ steps.kaggle.outputs.kernel_ref }}
        run: |
          set +e
          mkdir -p kaggle-smoke-output
          kaggle kernels output "${KERNEL_REF}" -p kaggle-smoke-output -o --page-size 50 | tee output-download.log
          find kaggle-smoke-output -type f -printf '%p %s bytes\n' | sort | tee output-files.log
          exit 0

      - name: Verify learned model evidence
        id: verify
        if: steps.monitor.outputs.outcome == 'complete'
        run: |
          set -euo pipefail
          MODEL="$(find kaggle-smoke-output -type f -name add_sub_smoke_model.pt -print -quit)"
          REPORT="$(find kaggle-smoke-output -type f -name add_sub_smoke_report.json -print -quit)"
          EVIDENCE="$(find kaggle-smoke-output -type f -name ADD_SUB_SMOKE_EVIDENCE.txt -print -quit)"
          test -n "$MODEL" && test -f "$MODEL"
          test -n "$REPORT" && test -f "$REPORT"
          test -n "$EVIDENCE" && test -f "$EVIDENCE"
          cp "$MODEL" verified-smoke/add_sub_smoke_model.pt
          cp "$REPORT" verified-smoke/add_sub_smoke_report.json
          cp "$EVIDENCE" verified-smoke/ADD_SUB_SMOKE_EVIDENCE.txt
          python - <<'PY'
          import json, os, pathlib
          p = pathlib.Path('verified-smoke/add_sub_smoke_report.json')
          r = json.loads(p.read_text())
          print(json.dumps(r, indent=2))
          if r.get('verdict') != 'PASS':
              raise SystemExit('Training report verdict is not PASS')
          if r['holdout']['rmse'] >= 0.35:
              raise SystemExit('Holdout RMSE gate failed')
          if r['holdout']['within_0_50'] <= 0.98:
              raise SystemExit('Holdout accuracy gate failed')
          model = pathlib.Path('verified-smoke/add_sub_smoke_model.pt')
          if model.stat().st_size < 1000 or model.stat().st_size > 1_000_000:
              raise SystemExit(f'Unexpected model size: {model.stat().st_size}')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('verdict=PASS\n')
              f.write('rmse=' + str(r['holdout']['rmse']) + '\n')
              f.write('accuracy=' + str(r['holdout']['within_0_50']) + '\n')
          PY

      - name: Upload compact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MathAI-ADD-SUB-smoke-evidence
          path: |
            verified-smoke/**
            launch.log
            status.log
            output-download.log
            output-files.log
          if-no-files-found: warn
          retention-days: 30

      - name: Upload verified tiny model
        if: steps.verify.outputs.verdict == 'PASS'
        uses: actions/upload-artifact@v4
        with:
          name: MathAI-ADD-SUB-VERIFIED
          path: |
            verified-smoke/add_sub_smoke_model.pt
            verified-smoke/add_sub_smoke_report.json
            verified-smoke/ADD_SUB_SMOKE_EVIDENCE.txt
          if-no-files-found: error
          retention-days: 30

      - name: Summary
        if: always()
        env:
          KERNEL_REF: ${{ steps.kaggle.outputs.kernel_ref }}
          OUTCOME: ${{ steps.monitor.outputs.outcome }}
          VERDICT: ${{ steps.verify.outputs.verdict }}
          RMSE: ${{ steps.verify.outputs.rmse }}
          ACCURACY: ${{ steps.verify.outputs.accuracy }}
        run: |
          {
            echo "## Kaggle add/sub mechanism test"
            echo "- Kernel: \`${KERNEL_REF}\`"
            echo "- Kaggle outcome: \`${OUTCOME}\`"
            echo "- Verification: \`${VERDICT}\`"
            echo "- Holdout RMSE: \`${RMSE}\`"
            echo "- Within ±0.50: \`${ACCURACY}\`"
            echo "- Source commit: \`${GITHUB_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"

name: DeepMind Harsh Pruned RSNN vs MLP

on:
  push:
    branches:
      - feat/pruned-snn-vs-mlp
    paths:
      - scripts/deepmind_pruned_snn_stress.py
      - scripts/pruned_snn_vs_mlp.py
      - .github/workflows/deepmind-pruned-snn-stress.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deepmind-harsh-multiseed:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"

    steps:
      - name: Checkout exact experiment source
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install CPU scientific stack
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install numpy sympy absl-py six
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Static experiment contract
        run: |
          set -euo pipefail
          python -m py_compile scripts/pruned_snn_vs_mlp.py scripts/deepmind_pruned_snn_stress.py
          grep -q 'DM_COMMIT = "427f45075f84b8b9774950196ad63867ca20ffb3"' scripts/deepmind_pruned_snn_stress.py
          grep -q 'TARGET_SCALE = 100.0' scripts/deepmind_pruned_snn_stress.py
          grep -q 'MAX_ABS_TARGET = 300.0' scripts/deepmind_pruned_snn_stress.py
          grep -q 'PRUNED_RSNN' scripts/deepmind_pruned_snn_stress.py
          grep -q 'ORDINARY_MLP' scripts/deepmind_pruned_snn_stress.py
          echo 'DEEPMIND_STRESS_STATIC_CONTRACT_PASS'

      - name: DeepMind parser and SNN invariant preflight
        run: |
          set -euo pipefail
          python scripts/deepmind_pruned_snn_stress.py --preflight | tee /tmp/deepmind-snn-preflight.log
          grep -q 'DEEPMIND_SOURCE_OK' /tmp/deepmind-snn-preflight.log
          grep -q 'DEEPMIND_PREFLIGHT_PASS' /tmp/deepmind-snn-preflight.log

      - name: Run harsh 5-seed 300-epoch DeepMind comparison
        run: |
          set -euo pipefail
          python scripts/deepmind_pruned_snn_stress.py \
            --train-size 8192 \
            --eval-size 2048 \
            --ill-pool-size 4096 \
            --ill-size 1024 \
            --epochs 300 \
            --batch-size 256 \
            --seeds 11,22,33,44,55 \
            --output-dir deepmind-snn-stress-output | tee /tmp/deepmind-snn-stress.log
          grep -q 'PARAMETER_MATCH SNN=26880 MLP=26880' /tmp/deepmind-snn-stress.log
          grep -q 'project synthetic data=0' /tmp/deepmind-snn-stress.log
          grep -q 'target=0.3000' /tmp/deepmind-snn-stress.log
          grep -q 'DEEPMIND_HARSH_BENCHMARK_COMPLETE' /tmp/deepmind-snn-stress.log

      - name: Print final scientific summary
        if: always()
        run: |
          echo '===== HARSH DEEPMIND SUMMARY ====='
          cat deepmind-snn-stress-output/SUMMARY.txt 2>/dev/null || true
          echo '===== LAST LOG LINES ====='
          tail -n 120 /tmp/deepmind-snn-stress.log 2>/dev/null || true

      - name: Upload harsh benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deepmind-pruned-rsnn-vs-mlp-harsh-evidence
          path: |
            deepmind-snn-stress-output/**
            /tmp/deepmind-snn-preflight.log
            /tmp/deepmind-snn-stress.log
          if-no-files-found: warn
          retention-days: 90

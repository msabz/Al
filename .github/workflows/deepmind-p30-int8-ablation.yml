name: DeepMind P30 INT8 Ablation

on:
  push:
    branches:
      - feat/p30-int8-ablation
    paths:
      - scripts/pruned_snn_vs_mlp.py
      - scripts/deepmind_pruned_snn_stress.py
      - scripts/deepmind_rsnn_pruning_sweep.py
      - scripts/deepmind_p30_int8_ablation.py
      - .github/workflows/deepmind-p30-int8-ablation.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p30-int8:
    name: P30 FP32 vs INT8 PTQ vs INT8 QAT
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      OMP_NUM_THREADS: 4
      MKL_NUM_THREADS: 4

    steps:
      - name: Checkout exact experiment source
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install CPU scientific stack
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install numpy sympy absl-py six
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Static contract
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/pruned_snn_vs_mlp.py \
            scripts/deepmind_pruned_snn_stress.py \
            scripts/deepmind_rsnn_pruning_sweep.py \
            scripts/deepmind_p30_int8_ablation.py
          grep -q 'FINAL_SPARSITY = 0.30' scripts/deepmind_p30_int8_ablation.py
          grep -q 'QAT_START_EPOCH = arch.PRUNE_END + 1' scripts/deepmind_p30_int8_ablation.py
          grep -q 'symmetric per-output-channel' scripts/deepmind_p30_int8_ablation.py
          grep -q 'weight-only' scripts/deepmind_p30_int8_ablation.py
          echo 'P30_INT8_STATIC_CONTRACT_PASS'

      - name: Preflight INT8 export and masks
        run: |
          set -euo pipefail
          python scripts/deepmind_p30_int8_ablation.py --preflight | tee /tmp/p30-int8-preflight.log
          grep -q 'P30_INT8_PREFLIGHT_PASS' /tmp/p30-int8-preflight.log

      - name: Run exact 5-seed DeepMind INT8 ablation
        run: |
          set -euo pipefail
          python scripts/deepmind_p30_int8_ablation.py \
            --train-size 8192 \
            --eval-size 2048 \
            --ill-pool-size 4096 \
            --ill-size 1024 \
            --epochs 300 \
            --batch-size 256 \
            --seeds 11,22,33,44,55 \
            --output-dir deepmind-p30-int8-output | tee /tmp/p30-int8.log
          grep -q 'project synthetic data=0' /tmp/p30-int8.log
          test -s deepmind-p30-int8-output/results.json
          test -s deepmind-p30-int8-output/SUMMARY.txt

      - name: Print INT8 summary
        if: always()
        run: |
          echo '===== P30 FP32 vs INT8 SUMMARY ====='
          cat deepmind-p30-int8-output/SUMMARY.txt 2>/dev/null || true
          echo '===== LAST LOG LINES ====='
          tail -n 220 /tmp/p30-int8.log 2>/dev/null || true

      - name: Upload INT8 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deepmind-p30-int8-ablation-evidence
          path: |
            deepmind-p30-int8-output/**
            /tmp/p30-int8-preflight.log
            /tmp/p30-int8.log
          if-no-files-found: warn
          retention-days: 90

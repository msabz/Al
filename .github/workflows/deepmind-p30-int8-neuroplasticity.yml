name: DeepMind P30 INT8 Neuroplasticity Ablation

on:
  push:
    branches:
      - feat/p30-int8-neuroplasticity
    paths:
      - scripts/pruned_snn_vs_mlp.py
      - scripts/deepmind_pruned_snn_stress.py
      - scripts/deepmind_rsnn_pruning_sweep.py
      - scripts/deepmind_p30_int8_ablation.py
      - scripts/deepmind_p30_int8_neuroplasticity.py
      - .github/workflows/deepmind-p30-int8-neuroplasticity.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  neuroplasticity-ablation:
    name: P30 INT8 QAT baseline vs rewiring vs consolidation
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      OMP_NUM_THREADS: 4
      MKL_NUM_THREADS: 4

    steps:
      - name: Checkout exact experiment source
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install CPU scientific stack
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install numpy sympy absl-py six
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Static contract
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/pruned_snn_vs_mlp.py \
            scripts/deepmind_pruned_snn_stress.py \
            scripts/deepmind_rsnn_pruning_sweep.py \
            scripts/deepmind_p30_int8_ablation.py \
            scripts/deepmind_p30_int8_neuroplasticity.py
          grep -q 'ACTIVE_EXPECTED = 18816' scripts/deepmind_p30_int8_neuroplasticity.py
          grep -q 'REWIRE_EPOCHS = (160, 180, 200, 220, 240)' scripts/deepmind_p30_int8_neuroplasticity.py
          grep -q 'REWIRE_FRACTION = 0.05' scripts/deepmind_p30_int8_neuroplasticity.py
          grep -q 'CONSOLIDATE_STREAK = 2' scripts/deepmind_p30_int8_neuroplasticity.py
          grep -q 'P30_INT8_QAT_REWIRE' scripts/deepmind_p30_int8_neuroplasticity.py
          grep -q 'P30_INT8_QAT_CONSOLIDATED' scripts/deepmind_p30_int8_neuroplasticity.py
          echo 'NEUROPLASTICITY_STATIC_CONTRACT_PASS'

      - name: Preflight temporary permanent and active budget
        run: |
          set -euo pipefail
          python scripts/deepmind_p30_int8_neuroplasticity.py \
            --preflight \
            --output-dir /tmp/unused | tee /tmp/neuroplasticity-preflight.log
          grep -q 'NEUROPLASTICITY_PREFLIGHT_PASS active=18816' /tmp/neuroplasticity-preflight.log

      - name: Run exact 5-seed DeepMind neuroplasticity ablation
        run: |
          set -euo pipefail
          python scripts/deepmind_p30_int8_neuroplasticity.py \
            --train-size 8192 \
            --eval-size 2048 \
            --ill-pool-size 4096 \
            --ill-size 1024 \
            --epochs 300 \
            --batch-size 256 \
            --seeds 11,22,33,44,55 \
            --output-dir deepmind-p30-int8-neuroplasticity-output | tee /tmp/neuroplasticity.log
          grep -q 'project synthetic data=0' /tmp/neuroplasticity.log
          grep -q 'NEUROPLASTICITY_EXPERIMENT_COMPLETE' /tmp/neuroplasticity.log

      - name: Print neuroplasticity summary
        if: always()
        run: |
          echo '===== P30 INT8 NEUROPLASTICITY SUMMARY ====='
          cat deepmind-p30-int8-neuroplasticity-output/SUMMARY.txt 2>/dev/null || true
          echo '===== LAST LOG LINES ====='
          tail -n 220 /tmp/neuroplasticity.log 2>/dev/null || true

      - name: Upload neuroplasticity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deepmind-p30-int8-neuroplasticity-evidence
          path: |
            deepmind-p30-int8-neuroplasticity-output/**
            /tmp/neuroplasticity-preflight.log
            /tmp/neuroplasticity.log
          if-no-files-found: warn
          retention-days: 90

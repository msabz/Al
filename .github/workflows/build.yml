name: RSNN Lab V2 Android Build
on:
  push:
    branches: [ "feat/open-growth-rsnn-v2-int8-android" ]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: gradle/actions/setup-gradle@v4

      - name: Embed exact pretrained Open-Growth stage-1 checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_ARTIFACT_ID: '9793122917'
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install numpy
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          mkdir -p pretrained-src app/src/main/assets
          curl -fL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_ARTIFACT_ID}/zip" \
            -o pretrained-stage1.zip
          unzip -q pretrained-stage1.zip -d pretrained-src
          CHECKPOINT="$(find pretrained-src -type f -path '*/stage1-open_growth/checkpoint.pt' -print -quit)"
          test -n "$CHECKPOINT"
          test -s "$CHECKPOINT"
          python scripts/export_stage1_checkpoint_for_android.py \
            --checkpoint "$CHECKPOINT" \
            --out app/src/main/assets/pretrained_open_growth_stage1.chk \
            --meta app/src/main/assets/pretrained_open_growth_stage1.meta.json
          test -s app/src/main/assets/pretrained_open_growth_stage1.chk
          sha256sum app/src/main/assets/pretrained_open_growth_stage1.chk
          echo 'e4bf889fe38f11a9f6eff4b144731443013c60844d91920439f2ebef41c2270e  app/src/main/assets/pretrained_open_growth_stage1.chk' | sha256sum -c -
          grep -q '"python_optimizer_step": 49344' app/src/main/assets/pretrained_open_growth_stage1.meta.json
          grep -q '"stream_cycle": 1392' app/src/main/assets/pretrained_open_growth_stage1.meta.json
          grep -q '"transferred_optimizer_moments": true' app/src/main/assets/pretrained_open_growth_stage1.meta.json

      - name: Unit tests
        shell: bash
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --no-daemon --stacktrace --console=plain 2>&1 | tee gradle-test.log
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RSNN-Lab-V2-Test-Diagnostics
          path: |
            gradle-test.log
            app/build/reports/tests/**
            app/build/test-results/**
          if-no-files-found: warn
      - name: Build APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace --console=plain 2>&1 | tee gradle-build.log
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RSNN-Lab-V2-Pretrained-Stage1-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90
      - name: Preserve converted pretrained checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: RSNN-OpenGrowth-Stage1-Android-Checkpoint
          path: |
            app/src/main/assets/pretrained_open_growth_stage1.chk
            app/src/main/assets/pretrained_open_growth_stage1.meta.json
          if-no-files-found: error
          retention-days: 90
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RSNN-Lab-V2-Build-Diagnostics
          path: gradle-build.log
          if-no-files-found: warn

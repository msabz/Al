name: DeepMind RSNN Distillation Tests

on:
  push:
    branches:
      - feat/rsnn-distillation-deepmind
    paths:
      - scripts/pruned_snn_vs_mlp.py
      - scripts/deepmind_pruned_snn_stress.py
      - scripts/deepmind_rsnn_distillation_tests.py
      - .github/workflows/deepmind-rsnn-distillation-tests.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dense-to-pruned:
    name: Dense RSNN to Pruned 30% Distillation
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      OMP_NUM_THREADS: 4
      MKL_NUM_THREADS: 4

    steps:
      - name: Checkout exact experiment source
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install CPU scientific stack
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install numpy sympy absl-py six
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Static contract
        run: |
          set -euo pipefail
          python -m py_compile scripts/pruned_snn_vs_mlp.py scripts/deepmind_pruned_snn_stress.py scripts/deepmind_rsnn_distillation_tests.py
          grep -q 'FINAL_SPARSITY = 0.30' scripts/deepmind_rsnn_distillation_tests.py
          grep -q 'HARD_WEIGHT = 0.50' scripts/deepmind_rsnn_distillation_tests.py
          grep -q 'SOFT_WEIGHT = 0.50' scripts/deepmind_rsnn_distillation_tests.py
          grep -q 'P30_SUPERVISED_CONTROL' scripts/deepmind_rsnn_distillation_tests.py
          echo 'DISTILLATION_STATIC_CONTRACT_PASS experiment=dense-to-pruned'

      - name: Preflight masks and parameter budget
        run: |
          set -euo pipefail
          python scripts/deepmind_rsnn_distillation_tests.py \
            --experiment dense-to-pruned \
            --preflight \
            --output-dir /tmp/unused | tee /tmp/dense-to-pruned-preflight.log
          grep -q 'DISTILLATION_PREFLIGHT_PASS experiment=dense-to-pruned params=26880 p30_active=18816' /tmp/dense-to-pruned-preflight.log

      - name: Run exact 5-seed DeepMind dense-to-pruned test
        run: |
          set -euo pipefail
          python scripts/deepmind_rsnn_distillation_tests.py \
            --experiment dense-to-pruned \
            --train-size 8192 \
            --eval-size 2048 \
            --ill-pool-size 4096 \
            --ill-size 1024 \
            --epochs 300 \
            --batch-size 256 \
            --seeds 11,22,33,44,55 \
            --output-dir deepmind-dense-to-pruned-output | tee /tmp/dense-to-pruned.log
          grep -q 'project synthetic data=0' /tmp/dense-to-pruned.log
          grep -q 'DISTILLATION_EXPERIMENT_COMPLETE experiment=dense-to-pruned' /tmp/dense-to-pruned.log

      - name: Print dense-to-pruned summary
        if: always()
        run: |
          echo '===== DENSE -> P30 DISTILLATION SUMMARY ====='
          cat deepmind-dense-to-pruned-output/SUMMARY.txt 2>/dev/null || true
          echo '===== LAST LOG LINES ====='
          tail -n 180 /tmp/dense-to-pruned.log 2>/dev/null || true

      - name: Upload dense-to-pruned evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deepmind-dense-to-pruned-distillation-evidence
          path: |
            deepmind-dense-to-pruned-output/**
            /tmp/dense-to-pruned-preflight.log
            /tmp/dense-to-pruned.log
          if-no-files-found: warn
          retention-days: 90

  mlp-to-dense-to-pruned:
    name: MLP to Dense RSNN to Pruned 30% Distillation
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      OMP_NUM_THREADS: 4
      MKL_NUM_THREADS: 4

    steps:
      - name: Checkout exact experiment source
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install CPU scientific stack
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install numpy sympy absl-py six
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Static contract
        run: |
          set -euo pipefail
          python -m py_compile scripts/pruned_snn_vs_mlp.py scripts/deepmind_pruned_snn_stress.py scripts/deepmind_rsnn_distillation_tests.py
          grep -q 'MLP_PRIMARY_TEACHER' scripts/deepmind_rsnn_distillation_tests.py
          grep -q 'DENSE_RSNN_DISTILLED_FROM_MLP' scripts/deepmind_rsnn_distillation_tests.py
          grep -q 'P30_STAGE2_DISTILLED_FROM_RSNN' scripts/deepmind_rsnn_distillation_tests.py
          echo 'DISTILLATION_STATIC_CONTRACT_PASS experiment=mlp-chain'

      - name: Preflight masks and parameter budget
        run: |
          set -euo pipefail
          python scripts/deepmind_rsnn_distillation_tests.py \
            --experiment mlp-chain \
            --preflight \
            --output-dir /tmp/unused | tee /tmp/mlp-chain-preflight.log
          grep -q 'DISTILLATION_PREFLIGHT_PASS experiment=mlp-chain params=26880 p30_active=18816' /tmp/mlp-chain-preflight.log

      - name: Run exact 5-seed DeepMind MLP chain test
        run: |
          set -euo pipefail
          python scripts/deepmind_rsnn_distillation_tests.py \
            --experiment mlp-chain \
            --train-size 8192 \
            --eval-size 2048 \
            --ill-pool-size 4096 \
            --ill-size 1024 \
            --epochs 300 \
            --batch-size 256 \
            --seeds 11,22,33,44,55 \
            --output-dir deepmind-mlp-chain-output | tee /tmp/mlp-chain.log
          grep -q 'project synthetic data=0' /tmp/mlp-chain.log
          grep -q 'DISTILLATION_EXPERIMENT_COMPLETE experiment=mlp-chain' /tmp/mlp-chain.log

      - name: Print MLP-chain summary
        if: always()
        run: |
          echo '===== MLP -> DENSE -> P30 DISTILLATION SUMMARY ====='
          cat deepmind-mlp-chain-output/SUMMARY.txt 2>/dev/null || true
          echo '===== LAST LOG LINES ====='
          tail -n 180 /tmp/mlp-chain.log 2>/dev/null || true

      - name: Upload MLP-chain evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deepmind-mlp-to-dense-to-pruned-evidence
          path: |
            deepmind-mlp-chain-output/**
            /tmp/mlp-chain-preflight.log
            /tmp/mlp-chain.log
          if-no-files-found: warn
          retention-days: 90

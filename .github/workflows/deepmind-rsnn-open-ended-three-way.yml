name: DeepMind RSNN Open-Ended Three-Way

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  train:
    name: Open-ended ${{ matrix.variant }}
    runs-on: ubuntu-24.04
    timeout-minutes: 245
    strategy:
      fail-fast: false
      matrix:
        variant:
          - adopted_p30
          - open_growth
          - dense_long
    env:
      OMP_NUM_THREADS: 4
      MKL_NUM_THREADS: 4
      PYTHONHASHSEED: '0'

    steps:
      - name: Checkout exact experiment source
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install CPU scientific stack
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install numpy sympy absl-py six
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Static contract
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/pruned_snn_vs_mlp.py \
            scripts/deepmind_pruned_snn_stress.py \
            scripts/deepmind_rsnn_pruning_sweep.py \
            scripts/deepmind_p30_int8_ablation.py \
            scripts/deepmind_rsnn_open_ended_three_way.py
          grep -q 'TRAIN_BUDGET_DEFAULT = 13200.0' scripts/deepmind_rsnn_open_ended_three_way.py
          grep -q 'PROTECT_FRACTION = 0.02' scripts/deepmind_rsnn_open_ended_three_way.py
          grep -q 'PRUNE_FRACTION = 0.02' scripts/deepmind_rsnn_open_ended_three_way.py
          grep -q 'SELECTION_STABLE_CYCLES = 3' scripts/deepmind_rsnn_open_ended_three_way.py
          grep -q 'SELECTION_NOVELTY = 0.01' scripts/deepmind_rsnn_open_ended_three_way.py
          echo OPEN_ENDED_STATIC_CONTRACT_PASS

      - name: Preflight model contract
        run: |
          set -euo pipefail
          python scripts/deepmind_rsnn_open_ended_three_way.py \
            --variant '${{ matrix.variant }}' --preflight | tee /tmp/preflight.log
          grep -q 'OPEN_ENDED_PREFLIGHT_PASS' /tmp/preflight.log

      - name: Run open-ended training
        run: |
          set -euo pipefail
          OUT='rsnn-open-ended-${{ matrix.variant }}'
          python scripts/deepmind_rsnn_open_ended_three_way.py \
            --variant '${{ matrix.variant }}' \
            --train-budget-seconds 13200 \
            --output-dir "$OUT" | tee /tmp/open-ended.log
          grep -q 'OPEN_ENDED_VARIANT_COMPLETE' /tmp/open-ended.log
          test -s "$OUT/results.json"
          test -s "$OUT/SUMMARY.txt"
          test -s "$OUT/bank_fingerprints.json"

      - name: Print summary
        if: always()
        run: |
          OUT='rsnn-open-ended-${{ matrix.variant }}'
          echo '===== OPEN-ENDED SUMMARY ====='
          cat "$OUT/SUMMARY.txt" 2>/dev/null || true
          echo '===== LAST LOG LINES ====='
          tail -n 220 /tmp/open-ended.log 2>/dev/null || true

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rsnn-open-ended-${{ matrix.variant }}-evidence
          path: |
            rsnn-open-ended-${{ matrix.variant }}/**
            /tmp/preflight.log
            /tmp/open-ended.log
          if-no-files-found: warn
          retention-days: 90

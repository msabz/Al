name: DeepMind P30 INT8 Growth Discovery

on:
  push:
    branches:
      - feat/p30-int8-growth-discovery
    paths:
      - scripts/pruned_snn_vs_mlp.py
      - scripts/deepmind_pruned_snn_stress.py
      - scripts/deepmind_rsnn_pruning_sweep.py
      - scripts/deepmind_p30_int8_ablation.py
      - scripts/deepmind_p30_int8_growth_discovery.py
      - .github/workflows/deepmind-p30-int8-growth-discovery.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  growth-discovery:
    name: P30 INT8 QAT baseline vs growth discovery
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      OMP_NUM_THREADS: 4
      MKL_NUM_THREADS: 4

    steps:
      - name: Checkout exact experiment source
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install CPU scientific stack
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install numpy sympy absl-py six
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Static contract
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/pruned_snn_vs_mlp.py \
            scripts/deepmind_pruned_snn_stress.py \
            scripts/deepmind_rsnn_pruning_sweep.py \
            scripts/deepmind_p30_int8_ablation.py \
            scripts/deepmind_p30_int8_growth_discovery.py
          grep -q 'P30_INT8_QAT_GROWTH_DISCOVERY' scripts/deepmind_p30_int8_growth_discovery.py
          grep -q 'VALIDATION_INTERPOLATE only' scripts/deepmind_p30_int8_growth_discovery.py
          grep -q 'P30_ACTIVE = 18816' scripts/deepmind_p30_int8_growth_discovery.py
          echo 'GROWTH_DISCOVERY_STATIC_CONTRACT_PASS'

      - name: Preflight growth and evidence tracking
        run: |
          set -euo pipefail
          python scripts/deepmind_p30_int8_growth_discovery.py --preflight | tee /tmp/growth-preflight.log
          grep -q 'GROWTH_DISCOVERY_PREFLIGHT_PASS' /tmp/growth-preflight.log

      - name: Run exact 5-seed DeepMind growth discovery test
        run: |
          set -euo pipefail
          python scripts/deepmind_p30_int8_growth_discovery.py \
            --train-size 8192 \
            --validation-size 1024 \
            --eval-size 2048 \
            --ill-pool-size 4096 \
            --ill-size 1024 \
            --epochs 300 \
            --batch-size 256 \
            --seeds 11,22,33,44,55 \
            --output-dir deepmind-p30-int8-growth-discovery-output | tee /tmp/growth-discovery.log
          grep -q 'project synthetic data=0' /tmp/growth-discovery.log
          grep -q 'GROWTH_DISCOVERY_EXPERIMENT_COMPLETE' /tmp/growth-discovery.log

      - name: Print growth discovery summary
        if: always()
        run: |
          echo '===== P30 INT8 GROWTH DISCOVERY SUMMARY ====='
          cat deepmind-p30-int8-growth-discovery-output/SUMMARY.txt 2>/dev/null || true
          echo '===== LAST LOG LINES ====='
          tail -n 220 /tmp/growth-discovery.log 2>/dev/null || true

      - name: Upload growth discovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deepmind-p30-int8-growth-discovery-evidence
          path: |
            deepmind-p30-int8-growth-discovery-output/**
            /tmp/growth-preflight.log
            /tmp/growth-discovery.log
          if-no-files-found: warn
          retention-days: 90

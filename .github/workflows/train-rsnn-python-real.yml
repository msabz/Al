name: RSNN Python Real-Data Proof

on:
  workflow_dispatch:
    inputs:
      steps:
        description: Training steps
        required: false
        default: "300"
  push:
    branches:
      - feat/open-growth-rsnn-python-code-v1
    paths:
      - "code_model/**"
      - ".github/workflows/train-rsnn-python-real.yml"

permissions:
  contents: read

jobs:
  train-real-python:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PYTHONUNBUFFERED: "1"
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install CPU training stack
        run: |
          python -m pip install --upgrade pip
          pip install numpy
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Syntax check
        run: python -m py_compile code_model/*.py

      - name: Collect real Python prompt-code pairs
        run: |
          python code_model/collect_real_python.py \
            --output-dir code_model/data \
            --max-per-repo 900

      - name: Train Open-Growth RSNN Code V1 with QAT
        shell: bash
        run: |
          STEPS="${{ github.event.inputs.steps || '300' }}"
          python -m code_model.run_integer_only \
            --train code_model/data/train.jsonl \
            --valid code_model/data/valid.jsonl \
            --out-dir code_model/output \
            --steps "$STEPS" \
            --batch-size 4 \
            --seq-len 256 \
            --emb-dim 128 \
            --hidden 160 \
            --layers 2 \
            --initial-sparsity 0.75 \
            --lr 0.002 \
            --structural-interval 60

      - name: Verify real-data provenance and INT8 export
        run: |
          test -s code_model/data/provenance.json
          test -s code_model/output/report.json
          test -s code_model/output/open_growth_rsnn_code_v1_int8.npz
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('code_model/data/provenance.json').read_text())
          r = json.loads(Path('code_model/output/report.json').read_text())
          assert p['policy'].startswith('real-source-only')
          assert p['train']['examples'] >= 500
          assert p['valid']['examples'] >= 100
          assert r['training'] == 'real-source-only'
          assert r['full_int8_target'] is True
          print('train_examples=', p['train']['examples'])
          print('valid_examples=', p['valid']['examples'])
          print('initial_val_loss=', r['initial_val_loss'])
          print('final_val_loss=', r['final_val_loss'])
          print('loss_improvement=', r['loss_improvement'])
          print('parameters=', r['total_parameters'])
          print('active_sparse_fraction=', r['active_sparse_fraction'])
          PY

      - name: Write Actions summary
        if: always()
        run: |
          if [ -f code_model/output/report.json ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          r=json.loads(Path('code_model/output/report.json').read_text())
          print('## Open-Growth RSNN Code V1 — real-data proof')
          print(f"- Steps: {r['steps']}")
          print(f"- Parameters: {r['total_parameters']:,}")
          print(f"- Initial held-out loss: {r['initial_val_loss']:.4f}")
          print(f"- Final held-out loss: {r['final_val_loss']:.4f}")
          print(f"- Improvement: {r['loss_improvement']:.4f}")
          print(f"- Active sparse fraction: {r['active_sparse_fraction']:.3f}")
          print(f"- Runtime: {r['elapsed_seconds']:.1f}s")
          PY
          fi

      - name: Upload trained model and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: open-growth-rsnn-code-v1-real-data
          if-no-files-found: warn
          retention-days: 14
          path: |
            code_model/output/
            code_model/data/provenance.json

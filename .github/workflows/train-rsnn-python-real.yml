name: RSNN Python Real-Data Proof

on:
  workflow_dispatch:
    inputs:
      steps:
        description: Training steps
        required: false
        default: "300"

permissions:
  contents: read

jobs:
  train-real-python:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PYTHONUNBUFFERED: "1"
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CPU training stack
        run: |
          python -m pip install --upgrade pip
          pip install numpy
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Syntax check
        run: python -m py_compile code_model/*.py

      - name: Collect real Python prompt-code pairs
        run: |
          python code_model/collect_real_python.py \
            --output-dir code_model/data \
            --max-per-repo 900

      - name: Train Open-Growth RSNN Code V1 with QAT
        shell: bash
        run: |
          STEPS="${{ github.event.inputs.steps || '300' }}"
          python -m code_model.run_integer_only \
            --train code_model/data/train.jsonl \
            --valid code_model/data/valid.jsonl \
            --out-dir code_model/output \
            --steps "$STEPS" \
            --batch-size 4 \
            --seq-len 256 \
            --emb-dim 128 \
            --hidden 160 \
            --layers 2 \
            --initial-sparsity 0.75 \
            --lr 0.002 \
            --structural-interval 60

      - name: Upload trained model and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: open-growth-rsnn-code-v1-real-data
          if-no-files-found: warn
          retention-days: 14
          path: |
            code_model/output/
            code_model/data/provenance.json

name: Launch Reviewed MAI5 v4 Release

on:
  push:
    branches:
      - feat/v5-deepmind-colab
    paths:
      - .github/workflows/launch-reviewed-v4-release.yml

permissions:
  contents: write
  actions: write

jobs:
  preflight-and-dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/v5-deepmind-colab
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply release-only v4 plumbing
        run: |
          set -euo pipefail
          python scripts/apply_v4_release_plumbing.py
          git diff --check
          python -m py_compile \
            scripts/apply_v4_release_plumbing.py \
            kaggle/kaggle_train.py \
            kaggle/deepmind_only_train_v4.py \
            colab/generalization_audit.py
          python - <<'PY'
          from pathlib import Path
          entry=Path('kaggle/kaggle_train.py').read_text()
          wrapper=Path('kaggle/deepmind_only_train_v4.py').read_text()
          audit=Path('colab/generalization_audit.py').read_text()
          wf=Path('.github/workflows/kaggle-train.yml').read_text()
          assert 'deepmind_only_train_v4.py' in entry
          assert 'deepmind_only_train_v3.py' not in entry
          assert 'SOURCE_COMMIT = globals().get("SOURCE_COMMIT")' in wrapper
          assert 'if state == runtime["FINITE"]' in wrapper
          assert 'DEEPMIND_BANK_GLOBAL_RESEED' in audit
          assert 'version != 4' in wf
          expected='math-ai-v5-mai5-v4-trainer'
          assert wf.count(expected) >= 3, wf.count(expected)
          assert 'math-ai-v5-mai5-v3-trainer' not in wf
          assert 'MathAI-v5-MAI5-v4-Kaggle-evidence' in wf
          print('V4_RELEASE_STATIC_CONTRACT_PASS')
          PY

      - name: Install CPU-only audit dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install numpy sympy absl-py six
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Prove official DeepMind audit bank reproducibility
        env:
          CUDA_VISIBLE_DEVICES: ''
        run: |
          set -euo pipefail
          python - <<'PY'
          import copy, importlib.util, pathlib, random
          root=pathlib.Path('.').resolve()
          p=root/'colab/generalization_audit.py'
          specmod=importlib.util.spec_from_file_location('v4_audit_preflight',p)
          audit=importlib.util.module_from_spec(specmod); specmod.loader.exec_module(audit)
          ns=audit.load_runtime(root)
          assert not ns['torch'].cuda.is_available()
          s=copy.deepcopy(audit.BANK_SPECS['interpolate_polynomial']); s['count']=24
          a=audit.build_official_bank(ns,s)
          random.seed(987654321); ns['np'].random.seed(123456789); ns['torch'].manual_seed(314159)
          b=audit.build_official_bank(ns,s)
          ea=[x['eq'] for x in a]; eb=[x['eq'] for x in b]
          assert ea==eb, 'same official DeepMind bank seed did not reproduce exact equations'
          assert all(x['f']==ns['POLYNOMIAL'] and x['state']==ns['FINITE'] for x in a)
          print('V4_DEEPMIND_BANK_REPRODUCIBILITY_PASS examples=',len(a))
          PY

      - name: Commit tested release plumbing only
        id: commit
        run: |
          set -euo pipefail
          git config user.name 'msabz'
          git config user.email '36938563+msabz@users.noreply.github.com'
          git add \
            kaggle/kaggle_train.py \
            kaggle/deepmind_only_train_v4.py \
            colab/generalization_audit.py \
            .github/workflows/kaggle-train.yml
          git diff --cached --exit-code && { echo 'No v4 release plumbing diff'; exit 1; } || true
          git commit -m 'Wire reviewed MAI5 v4 through deterministic Kaggle release'
          git push origin HEAD:feat/v5-deepmind-colab
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Exact generated-worker preflight at committed SHA
        env:
          SOURCE_SHA: ${{ steps.commit.outputs.sha }}
          MATHAI_WORK_DIR: /tmp/mathai-v4-exact-preflight
          CUDA_VISIBLE_DEVICES: ''
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, pathlib, py_compile, re, shutil
          sha=os.environ['SOURCE_SHA']
          assert re.fullmatch(r'[0-9a-f]{40}',sha),sha
          work=pathlib.Path(os.environ['MATHAI_WORK_DIR'])
          shutil.rmtree(work,ignore_errors=True); work.mkdir(parents=True)
          v4_path=pathlib.Path('kaggle/deepmind_only_train_v4.py')
          text=v4_path.read_text()
          marker='\n\ntry:\n    core.main()\n    validate_release_outputs()\nfinally:\n    cleanup_large_temporaries()'
          assert marker in text
          prefix=text.replace(marker,'\n',1)
          ns={'__name__':'v4_exact_release_preflight','__file__':str(v4_path),'SOURCE_COMMIT':sha}
          exec(compile(prefix,str(v4_path),'exec'),ns)
          core=ns['core']
          log=work/'preflight.log'
          with log.open('w') as fh:
              actual=core.prepare_source(fh)
          assert actual==sha,(actual,sha)
          worker=core.prepare_turbo_worker()
          worker=pathlib.Path(worker)
          py_compile.compile(str(worker),doraise=True)
          src=worker.read_text()
          required=(
              'count_target = root_count[poly_ids].clamp(1, ROOT_SLOTS) - 1',
              'nonpoly_match = (families[ids] != POLYNOMIAL)',
              'cardinality_per',
              'SYNTHETIC_POOL_SIZE = 0',
              'DEEPMIND_RATIO = 1.0',
          )
          missing=[m for m in required if m not in src]
          if missing: raise SystemExit(f'generated v4 worker missing: {missing}')
          trainer=(core.ROOT/'colab/train_v5_deepmind.py').read_text()
          assert 'MAGIC=0x4D414935; VERSION=4' in trainer
          audit=(core.ROOT/'colab/generalization_audit.py').read_text()
          assert 'DEEPMIND_BANK_GLOBAL_RESEED' in audit
          print('V4_EXACT_GENERATED_WORKER_PASS source=',sha,'worker=',worker)
          PY

      - name: Ensure no Kaggle training run is active
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          active="$(gh run list --workflow kaggle-train.yml --limit 20 --json status --jq '[.[] | select(.status == "queued" or .status == "in_progress")] | length')"
          echo "active_kaggle_runs=${active}"
          test "${active}" = 0 || { echo 'Kaggle training run already active; refusing duplicate dispatch.'; exit 50; }

      - name: Dispatch exactly one reviewed MAI5 v4 Kaggle run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run kaggle-train.yml --ref feat/v5-deepmind-colab
          echo REVIEWED_V4_GPU_RUN_DISPATCHED

name: Bundle trained Open-Growth stage1 into Android

on:
  push:
    branches:
      - feat/open-growth-rsnn-v2-int8-android
    paths:
      - scripts/export_stage1_checkpoint_for_android.py
      - .github/workflows/bundle-pretrained-stage1.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact Android branch
        uses: actions/checkout@v4
        with:
          ref: feat/open-growth-rsnn-v2-int8-android
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install checkpoint reader
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install numpy
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Download the existing trained stage-1 artifact
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9793122917/zip" \
            -o /tmp/stage1.zip
          mkdir -p /tmp/stage1
          unzip -q /tmp/stage1.zip -d /tmp/stage1
          CHECKPOINT="$(find /tmp/stage1 -type f -name checkpoint.pt -print -quit)"
          test -n "$CHECKPOINT"
          test -s "$CHECKPOINT"
          echo "CHECKPOINT=$CHECKPOINT" >> "$GITHUB_ENV"

      - name: Convert without retraining
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets
          python scripts/export_stage1_checkpoint_for_android.py \
            --checkpoint "$CHECKPOINT" \
            --out app/src/main/assets/pretrained_open_growth_stage1.chk \
            --meta app/src/main/assets/pretrained_open_growth_stage1.meta.json
          test -s app/src/main/assets/pretrained_open_growth_stage1.chk
          sha256sum app/src/main/assets/pretrained_open_growth_stage1.chk

      - name: Commit the trained checkpoint into the app branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/pretrained_open_growth_stage1.chk app/src/main/assets/pretrained_open_growth_stage1.meta.json
          if git diff --cached --quiet; then
            echo "Bundled checkpoint already up to date"
            exit 0
          fi
          git commit -m "Bundle already-trained Open-Growth stage1 checkpoint"
          git push origin HEAD:feat/open-growth-rsnn-v2-int8-android

name: Launch Reviewed MAI5 v3 Release

on:
  push:
    branches:
      - feat/v5-deepmind-colab
    paths:
      - .github/workflows/launch-reviewed-v3-release.yml

permissions:
  contents: read
  actions: write

jobs:
  dispatch-reviewed-v3:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/v5-deepmind-colab
          fetch-depth: 1

      - name: Verify reviewed v3 workflow is routed through default-branch path
        run: |
          set -euo pipefail
          grep -q 'name: Kaggle GPU Train v5 MAI5-v3' .github/workflows/kaggle-train.yml
          grep -q 'version != 3' .github/workflows/kaggle-train.yml
          grep -q 'deepmind_only_train_v3.py' kaggle/kaggle_train.py
          grep -q 'DEEPMIND_ONLY_PER_FAMILY_V2' colab/generalization_audit.py
          echo REVIEWED_V3_DISPATCH_CONTRACT_OK

      - name: Ensure no Kaggle training run is already active
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          active="$(gh run list --workflow kaggle-train.yml --limit 20 --json status --jq '[.[] | select(.status == "queued" or .status == "in_progress")] | length')"
          echo "active_kaggle_runs=${active}"
          test "${active}" = 0 || { echo 'Kaggle training run already active; refusing duplicate dispatch.'; exit 50; }

      - name: Dispatch exactly one reviewed MAI5 v3 Kaggle run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run kaggle-train.yml --ref feat/v5-deepmind-colab
          echo REVIEWED_V3_GPU_RUN_DISPATCHED

name: Cancel Kaggle Runs Now

on:
  push:
    branches: ["feat/v5-deepmind-colab"]
    paths: [".github/workflows/cancel-kaggle-now.yml"]

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel active/restarted Kaggle workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for run_id in 33324316841 33325786190; do
            echo "Cancelling run ${run_id}"
            gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/cancel" || true
          done

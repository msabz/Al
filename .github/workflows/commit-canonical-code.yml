name: Commit Tested Canonical v5 Code

on:
  push:
    branches: ["feat/v5-deepmind-colab"]
    paths: [".github/workflows/commit-canonical-code.yml"]

permissions:
  contents: write

jobs:
  test-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/v5-deepmind-colab
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: temurin

      - name: Apply exact tested migration
        run: |
          set -euo pipefail
          python scripts/migrate_v5_canonical_numeric.py
          python scripts/update_v5_tests_for_canonical.py
          python -m py_compile colab/train_v5_deepmind.py colab/turbo_train_v5.py kaggle/deepmind_only_train.py kaggle/kaggle_train.py

      - name: Android unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Commit code only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            app/src/main/java/com/example/equationsolver/ai/V5ModelSpec.kt \
            app/src/main/java/com/example/equationsolver/ai/StructuralMathEncoder.kt \
            app/src/main/java/com/example/equationsolver/ai/NeuralNetwork.kt \
            app/src/test/java/com/example/equationsolver/ai/CanonicalNumericEncoderTest.kt \
            app/src/test/java/com/example/equationsolver/ai/NeuralNetworkTest.kt \
            colab/train_v5_deepmind.py \
            colab/turbo_train_v5.py \
            kaggle/deepmind_only_train.py
          git diff --cached --check
          if git diff --cached --name-only | grep -q '^.github/workflows/'; then
            echo 'Refusing workflow mutation in code commit'
            exit 70
          fi
          git commit -m 'Use canonical numeric algebra representation and curriculum'
          git push origin HEAD:feat/v5-deepmind-colab
